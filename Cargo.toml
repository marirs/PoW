[package]
name = "pow"
version = "0.1.0"
edition = "2024"
description = "Multi-round, timing-validated, binding-aware Proof-of-Work challenge system"
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
